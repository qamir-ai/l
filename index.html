<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qamir AI</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><b>Qamir <span>AI</span></b><button id="new">＋ Yangi suhbat</button><div id="list"></div><footer><button id="profile">👤 Profil</button><button id="settings">⚙️ Agent sozlamalari</button><button id="logout">🚪 Chiqish</button></footer></aside><main><header><div><strong>Qamir AI</strong><small id="status">AI yordamchi</small></div></header><section id="chat"></section><div class="composer"><textarea id="msg" placeholder="Savolingizni yozing..."></textarea><button id="send">➤</button></div></main></div><div id="auth" class="modal"><div class="card"><h2 id="at">Qamir AI'ga kirish</h2><input id="un" placeholder="Login"><input id="pw" type="password" placeholder="Parol"><input id="em" placeholder="Email"><button id="authgo">Kirish</button><button id="switch">Ro‘yxatdan o‘tish</button><p id="ae"></p></div></div><div id="prof" class="modal hide"><div class="card"><h2>Profil</h2><img id="avatar"><input id="file" type="file" accept="image/*"><input id="pe" placeholder="Email"><label>Tug‘ilgan sana</label><input id="bd" type="date"><input id="city" placeholder="Qayerda turasiz?"><input id="np" type="password" placeholder="Yangi parol"><button id="savep">Saqlash</button><button data-close="prof">Yopish</button></div></div><div id="set" class="modal hide"><div class="card"><h2>Agent sozlamalari</h2><textarea id="ins"></textarea><input id="an" placeholder="Agent nomi"><button id="saves">Saqlash</button><button id="resets">Standartga qaytarish</button><button data-close="set">Yopish</button></div></div><script src="config.js"></script><script src="app.js"></script></body></html>
